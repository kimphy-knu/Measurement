# Build the site and publish it to GitHub Pages on every push to main/master:
#   /           site/index.html (landing)
#   /qo/        this repo's Vite app
#   /transport/ /arres/   prebuilt copies in site/, refreshed by scripts/sync-apps.ps1
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Landing page and the prebuilt sibling tools (scripts/sync-apps.ps1)
      # at the root, this app's build under /qo/.
      - run: |
          cp -r site _site
          cp -r dist _site/qo
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
